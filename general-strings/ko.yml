contribute:
  support:
    title: 지원
    card-text: 설명을 잘 하십니까? 포럼에서 다른 사용자를 도와주십시오.
  test:
    title: 테스트
    card-text: 뭐든 잘 망가뜨리십니까? 베타 테스터가 되어 주십시오.
  intro: 안테나팟은 자원봉사자들이 활발히 개발하고 있습니다. 코드로든 다른 방법으로든, 여러분도 기여할 수 있습니다!
  translate:
    title: 번역
    card-text: 영어 외의 언어를 하실 수 있습니까? 안테나팟 번역을 도와주십시오.
  develop:
    title: 개발
    card-text: 코드를 작성하십니까? 풀 리퀘스트 테스트를 돕거나, 앱 또는 웹사이트의 새 기능과 버그 수정을 제출해 주십시오.
    categories:
      app:
        title: 앱
        card-text: Java를 하십니까? 안테나팟 앱에 기여하는 방법을 알아보십시오.
        code-style:
          title: 코드 구조와 코드 스타일
        test-builds:
          title: 테스트 빌드 받기
        getting-credited:
          title: 기여자로 이름 올리기
      website:
        title: 웹사이트
        card-text: SCSS와 HTML에 익숙하십니까? 웹사이트 작업을 도와주십시오.
      upstream:
        title: 업스트림 및 다른 프로젝트
        card-text: 우리가 의존하는 다른 프로젝트에 기여해서 도와주십시오.
      infrastructure:
        title: 인프라
        card-text: 프로젝트에서 사용하는 서비스와 계정, 그리고 누가 접근 권한을 갖는지.
  promote:
    title: 홍보
    card-text: 눈길을 끄는 트윗, 흥미로운 블로그 글, 멋진 그래픽을 만드십니까? 널리 알리는 일을 도와주십시오.
  design:
    title: 디자인
    card-text: 복잡한 요청을 이해하기 쉬운 사용자 스토리나 와이어프레임으로 만드십니까? 이런 이슈 해결을 도와주십시오.
  donate:
    title: 기부
    card-text: 시간을 내기는 어렵지만 대신 돈으로 돕고 싶은 분을 위한 방법입니다.
    modal-title: 정말로 기부하시겠습니까?
    modal-button-donate: 그래도 기부하기
    modal-button-chat: 어떻게 도울 수 있을지 함께 이야기하기
    modal-button-contribute: 기여 방법 다시 살펴보기
