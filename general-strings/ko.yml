homepage:
  header: 오픈 팟캐스트 플레이어
  description: 안테나팟은 완전히 오픈된 팟캐스트 플레이어입니다. 앱은 오픈소스이고, 어떤 RSS 피드든 구독할 수 있습니다. 상업적
    이해관계 없이 자원봉사자들이 만들기 때문에 개인정보를 존중하면서도 모든 것을 여러분이 직접 제어할 수 있습니다.
  features:
    adfree:
      title: 광고 없음
      description: 안테나팟 앱 자체에는 광고가 없습니다. 팟캐스트 제작자가 미디어 파일에 광고를 넣기로 했다면 수익의 100%는
        제작자가 가져갑니다.
    listenanywhere:
      title: 어디서나 듣기
      description: 안테나팟에서는 에피소드를 다운로드해 어디서나 들을 수 있습니다. 자동으로 다운로드할 팟캐스트를 선택할 수도 
        있습니다.
  forum-posts:
    title: 커뮤니티 포럼
    description: 도움을 받고, 아이디어를 나누고, 다른 사용자와 소통하십시오
    view-all: 포럼 방문하기
    loading: 토론을 불러오는 중…
